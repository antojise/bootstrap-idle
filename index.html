<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07090a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Você acorda dentro de uma máquina apagada com uma única instrução funcionando. Reconstrua o sistema, comando por comando, até o kernel.">
<title>BOOTSTRAP</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<link rel="stylesheet" href="./ui/style.css">
</head>
<body>

<div id="crt"></div>

<!-- Sequência de abertura: só roda na primeira vez, e um toque pula. -->
<div id="boot">
  <div id="boot-linhas"></div>
  <div id="boot-pular">toque para pular</div>
</div>

<header id="hud">
  <div>
    <div id="hud-bytes">0 B</div>
    <div id="hud-taxa"></div>
  </div>
  <div id="hud-dir">
    <div id="hud-ato"></div>
    <div id="hud-recursos">
      <span class="r-ciclo"></span><span class="r-perm"></span><span class="r-frag"></span>
    </div>
  </div>
</header>

<main id="tela">

  <section class="painel" id="p-exec">
    <div id="exec-alvo"></div>
    <button id="btn-exec">
      <span id="btn-exec-nome">echo</span>
      <small>EXECUTAR</small>
    </button>
    <div id="alias"></div>

    <div id="ciclos-resumo">
      <div class="secao">DAEMONS EM CICLO</div>
      <div class="slot-fila" id="slot-fila"></div>
      <div class="card-desc" id="ciclos-txt"></div>
    </div>

    <div class="secao">SAÍDA</div>
    <div id="log"></div>
  </section>

  <section class="painel" id="p-arvore"></section>
  <section class="painel" id="p-sistema"></section>
  <section class="painel" id="p-rede"></section>
  <section class="painel" id="p-recomp"></section>
  <section class="painel" id="p-mais"></section>

</main>

<nav id="nav">
  <button data-aba="exec"><span class="ic">▶</span>EXEC<span class="badge"></span></button>
  <button data-aba="arvore"><span class="ic">⌘</span>ÁRVORE<span class="badge"></span></button>
  <button data-aba="sistema"><span class="ic">◍</span>SISTEMA<span class="badge"></span></button>
  <button data-aba="rede"><span class="ic">⇄</span>REDE<span class="badge"></span></button>
  <button data-aba="recomp"><span class="ic">◆</span>RECOMP<span class="badge"></span></button>
  <button data-aba="mais"><span class="ic">★</span>MAIS<span class="badge"></span></button>
</nav>

<div id="sheet-bg"></div>
<div id="sheet">
  <div class="puxador"></div>
  <div id="sheet-corpo"></div>
  <div id="sheet-acoes"></div>
  <button class="btn larg" id="sheet-fechar" style="margin-top:9px">FECHAR</button>
</div>

<div id="ato-ov">
  <div class="n" id="ov-n"></div>
  <h1 id="ov-tit"></h1>
  <p id="ov-txt"></p>
  <div class="rev" id="ov-rev"></div>
  <button class="btn pri" id="ov-btn">CONTINUAR</button>
  <button class="btn" id="ov-cancel" style="margin-top:10px;display:none">CANCELAR</button>
</div>

<div id="fx"></div>
<div id="toasts"></div>

<script type="module" src="./ui/app.js"></script>
</body>
</html>
