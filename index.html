<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>BOOTSTRAP</title>
  <style>
    :root {
      --bg:     #0c0c0c;
      --bg2:    #141414;
      --bg3:    #1c1c1c;
      --fg:     #b8b8b8;
      --green:  #4ade80;
      --amber:  #fbbf24;
      --blue:   #60a5fa;
      --dim:    #4a4a4a;
      --border: #242424;
      --font:   'Courier New', 'Consolas', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: var(--font); font-size: 13px;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Header ─────────────────────────────────────────────── */
    #header {
      position: sticky; top: 0; z-index: 10;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    #bytes    { font-size: 22px; font-weight: bold; color: var(--green); line-height: 1; }
    #rate     { font-size: 11px; color: var(--dim); margin-top: 2px; }
    #ato-nome { font-size: 11px; color: var(--dim); text-align: right; }

    /* ── Main ────────────────────────────────────────────────── */
    #main { padding: 10px 12px; max-width: 480px; margin: 0 auto; }

    /* ── Slots ───────────────────────────────────────────────── */
    #slots {
      font-size: 11px; color: var(--dim);
      text-align: center; margin-bottom: 8px;
      letter-spacing: 0.05em;
    }

    /* ── Cartão de comando ───────────────────────────────────── */
    .cmd-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 6px; margin-bottom: 7px; overflow: hidden;
      transition: border-color 0.2s;
    }
    .cmd-card.forgeable { border-color: var(--amber); }
    .cmd-card.forjado   { border-color: #1f3a27; }

    .cmd-top {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 12px; cursor: pointer; user-select: none;
    }
    .cmd-top:active { background: var(--bg3); }

    .cmd-name        { color: var(--green); font-weight: bold; flex: 1; font-size: 14px; }
    .cmd-name.inativo { color: #3a5a3a; }
    .cmd-y           { color: var(--amber); font-size: 11px; white-space: nowrap; }
    .cmd-xcount      { font-size: 11px; color: var(--dim); white-space: nowrap; }

    .cmd-body { padding: 0 12px 9px; }

    /* req rows */
    .req-row {
      display: flex; align-items: center; gap: 8px;
      margin-top: 5px; font-size: 11px;
    }
    .req-label { width: 52px; color: var(--dim); flex-shrink: 0; }
    .prog-wrap { flex: 1; height: 3px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
    .prog-fill { height: 100%; background: var(--green); transition: width 0.4s linear; }
    .req-num   { width: 80px; text-align: right; color: var(--dim); flex-shrink: 0; }
    .req-num.ok { color: var(--green); }

    /* botão forjar */
    .btn-forjar {
      display: block; width: 100%; margin-top: 8px;
      padding: 7px 10px; border: none; border-radius: 4px;
      font-family: var(--font); font-size: 12px; font-weight: bold;
      cursor: pointer; transition: background 0.15s;
      background: var(--amber); color: #0c0c0c;
    }
    .btn-forjar:disabled { background: var(--bg3); color: var(--dim); cursor: default; }

    /* daemon row */
    .daemon-row {
      display: flex; align-items: center; gap: 8px;
      margin-top: 7px;
    }
    .daemon-btn {
      width: 30px; height: 30px; border-radius: 4px;
      border: 1px solid var(--dim); background: none;
      cursor: pointer; font-size: 14px; color: var(--dim);
      font-family: var(--font); line-height: 1; flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .daemon-btn.on { border-color: var(--green); color: var(--green); background: #081a0e; }
    .daemon-lbl { font-size: 11px; color: var(--dim); }

    /* ── Log ─────────────────────────────────────────────────── */
    #log {
      margin-top: 10px; padding: 7px 10px;
      border: 1px solid var(--border); border-radius: 4px;
      font-size: 11px; color: var(--dim);
      max-height: 72px; overflow-y: auto;
    }
    #log div { margin-top: 2px; }
    #log div:first-child { margin-top: 0; }
  </style>
</head>
<body>

<div id="header">
  <div>
    <div id="bytes">0 B</div>
    <div id="rate"></div>
  </div>
  <div id="ato-nome">Ato I — O Vazio</div>
</div>

<div id="main">
  <div id="slots"></div>
  <div id="cmds"></div>
  <div id="log"></div>
</div>

<script type="module">
import { novoEstado, validarEstado }             from './src/engine/state.js';
import { tick }                                   from './src/engine/tick.js';
import { executarCmd, producaoPassiva }           from './src/engine/economy.js';
import { podeForjar, forjar }                     from './src/engine/forge.js';
import { ciclosTotais }                           from './src/engine/daemons.js';
import { aplicarAusencia }                        from './src/engine/offline.js';
import { CMDS, ORDER }                            from './src/data/commands.js';
import { ATOS }                                   from './src/data/acts.js';

// ── Persistência ──────────────────────────────────────────────────────────────
const KEY = 'bootstrap_v2';

function salvar() {
  try { localStorage.setItem(KEY, JSON.stringify({ ...state, _ts: Date.now() })); } catch {}
}

function carregar() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!raw) return novoEstado();
    const ts  = raw._ts || Date.now();
    const s   = validarEstado(raw);
    const aus = Math.floor((Date.now() - ts) / 1000);
    if (aus > 10) {
      const r = aplicarAusencia(s, aus);
      log(`offline ${fmtT(aus)} → +${fmt(r.bytes)} B  ${r.motivo}`);
    }
    return s;
  } catch { return novoEstado(); }
}

let state = carregar();

// ── Loop ──────────────────────────────────────────────────────────────────────
const DT_LOGIC  = 0.05;   // 20 ticks/s de lógica
const DT_RENDER = 100;    // ms entre renders
let ultimo      = performance.now();
let accumLogic  = 0;
let ultimoRender = 0;

function loop(agora) {
  const dt = Math.min((agora - ultimo) / 1000, 2);
  ultimo = agora;
  accumLogic += dt;

  while (accumLogic >= DT_LOGIC) {
    accumLogic -= DT_LOGIC;
    const { novosAtos, novasConquistas } = tick(state, DT_LOGIC);
    novosAtos.forEach(n => {
      const a = ATOS.find(x => x.n === n);
      if (a) log(`>>> ${a.nome} desbloqueado <<<`);
    });
    novasConquistas.forEach(id => log(`[conquista] ${id}`));
  }

  if (agora - ultimoRender >= DT_RENDER) {
    ultimoRender = agora;
    render();
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
setInterval(salvar, 8000);
window.addEventListener('pagehide', salvar);

// ── Click manual ─────────────────────────────────────────────────────────────
function clicar(cmd) {
  if (!state.run.forjados.includes(cmd)) return;
  const multi = state.run.ups.pipe ? 2 : 1;
  executarCmd(cmd, state, 1, 1);
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  // header
  const { run } = state;
  document.getElementById('bytes').textContent = fmt(run.bytes) + ' B';

  const taxa = producaoPassiva(state);
  document.getElementById('rate').textContent = taxa > 0.01 ? fmt(taxa) + ' B/s' : '';

  const ato = ATOS.find(a => a.n === run.ato);
  if (ato) document.getElementById('ato-nome').textContent = `Ato ${ato.n} — ${ato.nome}`;

  // slots
  const total = ciclosTotais(state);
  const usados = Math.min(run.daemons.length, total);
  document.getElementById('slots').textContent = `ciclos: ${usados} / ${total}`;

  // comandos visíveis neste ato
  const visiveis = ORDER.filter(c => CMDS[c].ato <= run.ato);
  const container = document.getElementById('cmds');

  // criar cartões que faltam (em ordem)
  visiveis.forEach(cmd => {
    if (!document.getElementById(`card-${cmd}`)) {
      container.appendChild(criarCard(cmd));
    }
  });

  // atualizar cada cartão
  visiveis.forEach(cmd => atualizarCard(cmd));
}

// ── Criar estrutura estável do cartão ────────────────────────────────────────
function criarCard(cmd) {
  const d   = CMDS[cmd];
  const div = document.createElement('div');
  div.id        = `card-${cmd}`;
  div.className = 'cmd-card';

  // topo (clicável)
  const top = document.createElement('div');
  top.className = 'cmd-top';
  top.innerHTML = `
    <span class="cmd-name" id="${cmd}-nm">${cmd}</span>
    <span class="cmd-y">+${fmt(d.y)}&nbsp;B</span>
    <span class="cmd-xcount" id="${cmd}-xc"></span>`;
  top.addEventListener('click', () => clicar(cmd));
  div.appendChild(top);

  // corpo (conteúdo muda entre forjado/pendente — reconstruído uma vez)
  const body = document.createElement('div');
  body.id        = `body-${cmd}`;
  body.className = 'cmd-body';
  div.appendChild(body);

  return div;
}

// ── Atualizar cartão em-lugar ─────────────────────────────────────────────────
function atualizarCard(cmd) {
  const d       = CMDS[cmd];
  const { run } = state;
  const forjado = run.forjados.includes(cmd);
  const pode    = podeForjar(cmd, state);
  const card    = document.getElementById(`card-${cmd}`);
  const body    = document.getElementById(`body-${cmd}`);
  if (!card || !body) return;

  // classe do cartão
  card.className = `cmd-card${forjado ? ' forjado' : pode ? ' forgeable' : ''}`;

  // nome
  document.getElementById(`${cmd}-nm`).className = `cmd-name${forjado ? '' : ' inativo'}`;

  // contagem de execuções
  document.getElementById(`${cmd}-xc`).textContent =
    forjado ? `×${fmtN(run.execs[cmd] || 0)}` : '';

  // ── Modo: pendente / forjado ──────────────────────────────────────────────
  const modeAtual = body.dataset.mode || '';
  const modeNovo  = forjado ? 'F' : 'P';

  if (modeAtual !== modeNovo) {
    body.dataset.mode = modeNovo;
    body.innerHTML    = '';

    if (!forjado) {
      // Linhas de requisito
      Object.entries(d.req).forEach(([pai, necessario]) => {
        const row = document.createElement('div');
        row.className = 'req-row';
        row.innerHTML = `
          <span class="req-label">${pai}</span>
          <div class="prog-wrap"><div class="prog-fill" id="${cmd}-f-${pai}"></div></div>
          <span class="req-num" id="${cmd}-n-${pai}"></span>`;
        body.appendChild(row);
      });

      // Botão forjar
      const btn = document.createElement('button');
      btn.id        = `btn-${cmd}`;
      btn.className = 'btn-forjar';
      let lbl = `forjar ${cmd}`;
      if (d.bytes > 0) lbl += ` · ${fmt(d.bytes)} B`;
      if (d.perm  > 0) lbl += ` · ${d.perm} ⚿`;
      btn.textContent = lbl;
      btn.addEventListener('click', e => {
        e.stopPropagation();
        if (podeForjar(cmd, state)) { forjar(cmd, state); salvar(); }
      });
      body.appendChild(btn);

    } else {
      // Daemon toggle
      const row  = document.createElement('div');
      row.className = 'daemon-row';
      const btn  = document.createElement('button');
      btn.id        = `dt-${cmd}`;
      btn.className = 'daemon-btn';
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const on = state.run.daemons.includes(cmd);
        if (on) {
          state.run.daemons = state.run.daemons.filter(c => c !== cmd);
        } else if (state.run.daemons.length < ciclosTotais(state)) {
          state.run.daemons.push(cmd);
        }
      });
      const lbl = document.createElement('span');
      lbl.id        = `dl-${cmd}`;
      lbl.className = 'daemon-lbl';
      row.appendChild(btn);
      row.appendChild(lbl);
      body.appendChild(row);
    }
  }

  // ── Atualizar partes dinâmicas ────────────────────────────────────────────
  if (!forjado) {
    Object.entries(d.req).forEach(([pai, necessario]) => {
      const atual = run.execs[pai] || 0;
      const pct   = Math.min(100, (atual / necessario) * 100);
      const fill  = document.getElementById(`${cmd}-f-${pai}`);
      const num   = document.getElementById(`${cmd}-n-${pai}`);
      if (fill) fill.style.width = pct.toFixed(1) + '%';
      if (num) {
        num.textContent  = `${fmtN(atual)} / ${fmtN(necessario)}`;
        num.className    = `req-num${atual >= necessario ? ' ok' : ''}`;
      }
    });
    const btn = document.getElementById(`btn-${cmd}`);
    if (btn) btn.disabled = !pode;

  } else {
    const on   = run.daemons.includes(cmd);
    const btn  = document.getElementById(`dt-${cmd}`);
    const lbl  = document.getElementById(`dl-${cmd}`);
    const chei = run.daemons.length >= ciclosTotais(state);
    if (btn) {
      btn.className   = `daemon-btn${on ? ' on' : ''}`;
      btn.textContent = on ? '▶' : '○';
    }
    if (lbl) lbl.textContent = on ? 'daemon ativo' : chei ? 'sem ciclo livre' : 'iniciar daemon';
  }
}

// ── Formatação ────────────────────────────────────────────────────────────────
function fmt(n) {
  if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return (n / 1e9).toFixed(2)  + 'G';
  if (n >= 1e6)  return (n / 1e6).toFixed(2)  + 'M';
  if (n >= 1e3)  return (n / 1e3).toFixed(1)  + 'k';
  return Math.floor(n).toString();
}
function fmtN(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
  return n.toString();
}
function fmtT(s) {
  if (s < 60)   return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'min';
  return Math.floor(s / 3600) + 'h' + Math.floor((s % 3600) / 60) + 'min';
}

// ── Log ───────────────────────────────────────────────────────────────────────
function log(msg) {
  const el   = document.getElementById('log');
  const linha = document.createElement('div');
  linha.textContent = '> ' + msg;
  el.appendChild(linha);
  if (el.children.length > 30) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}
</script>
</body>
</html>
